openapi: 3.1.0
info:
  title: Notix
  version: 1.0.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /tareas:
    get:
      operationId: listarTareas
      summary: Lista las tareas visibles del tablero
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EstadoTarea"
      responses:
        "200":
          description: Lista de tareas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaTareas"
        "401": { $ref: "#/components/responses/Error401" }
        "422": { $ref: "#/components/responses/Error422" }
    post:
      operationId: crearTarea
      summary: Crea una tarea en estado pendiente
      description: El colaborador crea tareas para sí mismo; el propietario puede asignar el usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TareaNueva"
      responses:
        "201":
          description: La tarea creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaTarea"
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "422": { $ref: "#/components/responses/Error422" }
  /tareas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: verTarea
      summary: Devuelve una tarea
      responses:
        "200":
          description: La tarea solicitada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaTarea"
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "404": { $ref: "#/components/responses/Error404" }
    put:
      operationId: actualizarTarea
      summary: Actualiza el título de una tarea
      description: El propietario puede modificar cualquier tarea; el colaborador solo las suyas. El estado se cambia únicamente con PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TareaActualizacion"
      responses:
        "200":
          description: La tarea actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaTarea"
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
    patch:
      operationId: cambiarEstadoTarea
      summary: Cambia el estado de una tarea
      description: Solo permite pendiente → en_proceso → completada; completada es final. El propietario puede cambiar cualquier tarea y el colaborador solo las suyas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  $ref: "#/components/schemas/EstadoTarea"
      responses:
        "200":
          description: La tarea con el estado nuevo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaTarea"
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "422": { $ref: "#/components/responses/Error422" }
    delete:
      operationId: eliminarTarea
      summary: Elimina una tarea
      description: El propietario puede eliminar cualquier tarea; el colaborador solo las suyas.
      responses:
        "200":
          description: Confirmación de eliminación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaMensaje"
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
  /usuarios:
    get:
      operationId: listarUsuarios
      summary: Lista los usuarios y sus tareas
      description: Solo disponible para el propietario.
      responses:
        "200":
          description: Usuarios y tareas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUsuarios"
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
  /login:
    post:
      operationId: iniciarSesion
      summary: Entrega un token a cambio de usuario y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, clave]
              properties:
                usuario: { type: string }
                clave: { type: string, format: password }
      responses:
        "200":
          description: El token de la sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginToken"
        "400": { $ref: "#/components/responses/Error400Sesion" }
        "401": { $ref: "#/components/responses/Error401" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EstadoTarea:
      type: string
      enum: [pendiente, en_proceso, completada]
    Tarea:
      type: object
      required: [id, titulo, estado, usuario_id]
      properties:
        id: { type: integer, minimum: 1, readOnly: true }
        titulo: { type: string }
        estado:
          $ref: "#/components/schemas/EstadoTarea"
        usuario_id:
          type: integer
          minimum: 1
    TareaNueva:
      type: object
      required: [titulo]
      properties:
        titulo: { type: string, minLength: 1 }
        usuario_id:
          type: integer
          minimum: 1
          description: El propietario puede asignar otro usuario; si se omite, se usa la cuenta autenticada.
    TareaActualizacion:
      type: object
      required: [titulo]
      properties:
        titulo: { type: string, minLength: 1 }
    Usuario:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer, minimum: 1, readOnly: true }
        nombre: { type: string }
        tareas:
          type: array
          items:
            $ref: "#/components/schemas/Tarea"
    ErrorDetalle:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string }
        mensaje: { type: string }
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, const: false }
        error:
          $ref: "#/components/schemas/ErrorDetalle"
    ErrorSesion:
      type: object
      required: [error]
      properties:
        error: { type: string }
    RespuestaTarea:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          $ref: "#/components/schemas/Tarea"
    RespuestaTareas:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Tarea"
    RespuestaUsuarios:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Usuario"
    RespuestaMensaje:
      type: object
      required: [ok, datos]
      properties:
        ok: { type: boolean, const: true }
        datos:
          type: object
          required: [mensaje]
          properties:
            mensaje: { type: string }
    LoginToken:
      type: object
      required: [token]
      properties:
        token: { type: string }
  responses:
    Error400:
      description: El servidor no entendió la petición
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error400Sesion:
      description: El cuerpo de inicio de sesión no es JSON válido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorSesion" }
    Error401:
      description: Falta un token válido o las credenciales son incorrectas
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ErrorSesion"
    Error403:
      description: La cuenta autenticada no tiene permiso para esta operación
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ErrorSesion"
    Error404:
      description: No existe el elemento solicitado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error422:
      description: Se entendió la petición, pero infringe una regla de negocio o transición
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
